version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      next:
        patterns:
          - next
          - eslint-config-next
      prisma:
        patterns:
          - prisma
          - "@prisma/*"
      auth:
        patterns:
          - next-auth
          - "@auth/*"
      anthropic:
        patterns:
          - "@anthropic-ai/*"
    # Block major bumps on packages with known breaking changes for our
    # current stack. Remove an entry only when you've planned a deliberate
    # migration for that ecosystem (e.g. Prisma 7 requires moving
    # datasource.url to a prisma.config.ts file).
    ignore:
      - dependency-name: prisma
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
